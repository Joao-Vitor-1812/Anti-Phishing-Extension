<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <form class="card">
        <div id="area-formulario">
            <select id="instituicao" class="select" required>
                <option value="" disabled selected hidden>Selecione a Instituição</option>
                <option value="govbr">Governo Federal</option>
                <option value="bb">Banco do Brasil</option>
                <option value="santander">Santander</option>
                <option value="itau">Itaú</option>
                <option value="nubank">Nubank</option>
            </select>

            <input type="text" class="input" placeholder="Cole o link suspeito">

            <button type="submit" class="button">Verificar</button>
        </div>

        <div id="area-resultado" class="oculto">
            <div id="banner-resultado"></div>
            <button id="btn-voltar" type="button" class="button btn-voltar">Verificar outro link</button>
        </div>
    </form>

    <script src="../scripts/script.js"></script>
</body>
</html>
